<style>
:root{--bg:#fff1dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3a2a22}}
:root[data-theme="dark"]{--bg:#3a2a22}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);overflow:hidden;position:relative;font-family:"Jua","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#5a3a22;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#box{position:absolute;left:0;top:0;width:450px;height:800px;transform-origin:0 0;overflow:hidden;border-radius:16px;background:#ffe9c9}
canvas{position:absolute;inset:0;width:450px;height:800px;touch-action:none}
.ov{position:absolute;inset:0;display:none}
button{font:inherit;color:#5a3a22;border:0;border-radius:18px;background:#fff;box-shadow:0 4px 0 #e0c4a0;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #e0c4a0}
#menu{background:linear-gradient(#ffd9a0,#fff1dc)}
.card{position:absolute;left:25px;top:70px;width:400px;box-sizing:border-box;padding:18px;background:#fff;border-radius:28px;text-align:center}
.card h2{margin:4px 0 10px;font-size:30px;font-weight:400}
.sh{background:rgba(60,35,20,.55)}
.big{width:100%;height:58px;font-size:23px;margin-top:10px;background:#ffc94a;box-shadow:0 4px 0 #d9a020}
.big.alt{background:#bfe8ff;box-shadow:0 4px 0 #8cc0e0}
.big.sm{height:48px;font-size:19px;background:#fff;box-shadow:0 4px 0 #e0c4a0}
.big.no{background:#eee;color:#aaa;box-shadow:0 4px 0 #d8d8d8}
.pill{display:inline-block;background:#fff3d6;border-radius:20px;padding:6px 14px;font-size:18px;margin:2px}
#home{position:absolute;right:4px;top:4px;width:48px;height:48px;font-size:24px;display:none;opacity:.9;padding:0}
#toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:#5a3a22;color:#fff;padding:9px 18px;border-radius:20px;font-size:18px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:420px}
#shl{height:430px;overflow-y:auto;touch-action:pan-y;text-align:left}
.it{display:flex;align-items:center;gap:10px;background:#fff6e6;border-radius:18px;padding:8px 10px;margin-bottom:8px}
.it b{font-size:30px;font-weight:400;width:40px;text-align:center}
.it div{flex:1;font-size:15px;line-height:1.25}.it div span{font-size:19px}
.it button{width:104px;height:48px;font-size:17px;padding:0}
.it button.no{background:#eee;color:#aaa;box-shadow:0 4px 0 #d8d8d8}
.it small{opacity:.7;font-size:13px}.it.rec{background:#fff1b8;outline:3px solid #ffc94a}.it .why{color:#c0601a;font-weight:400;font-size:14px}
.sum{background:#fff6e6;border-radius:16px;padding:8px 12px;font-size:16px;line-height:1.5;text-align:left;margin-bottom:8px}
.ht{margin:8px 0 4px;font-size:16px;text-align:left}
.card input{width:100%;box-sizing:border-box;height:56px;border:3px solid #f0c890;border-radius:16px;font:inherit;font-size:24px;text-align:center;color:#5a3a22;background:#fffaf0;margin:8px 0 4px;user-select:text;-webkit-user-select:text;touch-action:auto;outline:none}
.card input:focus{border-color:#ffc94a}
.err{color:#d03030;font-size:16px;min-height:22px}
.tabs{display:flex;gap:8px;margin:0 0 6px}.tab{flex:1;height:44px;font-size:19px;box-shadow:0 3px 0 #e0c4a0}.tab.on{background:#ffc94a;box-shadow:0 3px 0 #d9a020}
#lbl{height:540px;overflow-y:auto;touch-action:pan-y;text-align:left}
.lr{display:flex;align-items:center;gap:8px;background:#fff6e6;border-radius:14px;padding:7px 10px;margin-bottom:6px;font-size:19px}
.lr.me{background:#ffe9a8;outline:3px solid #ffc94a}
.lr b{width:40px;text-align:center;font-weight:400;font-size:22px}.lr .ln{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .ls{text-align:right;line-height:1.1}.lr .ls i{font-style:normal;display:block}.lr .ls small{font-size:13px;opacity:.7}
#ver{font-size:13px;opacity:.6;margin-top:8px}
#bk{position:absolute;left:37px;top:34px;height:40px;padding:0 12px;font-size:16px;display:flex;align-items:center;text-decoration:none;color:#5a3a22;background:#fff;border-radius:16px;box-shadow:0 3px 0 #e0c4a0;z-index:2}
#bk:active{transform:translateY(2px);box-shadow:0 1px 0 #e0c4a0}
</style></head><body>
<div id="box">
 <canvas id="cv" width="450" height="800"></canvas>
 <button id="home">⏸️</button>
 <div id="menu" class="ov">
  <a id="bk" href="./">🏪 내 가게</a>
  <div class="card" style="top:22px"><div style="font-size:64px;line-height:1.1">🔥</div><h2>붕어빵 챌린지</h2>
   <div id="mw"></div><p id="mi" style="font-size:16px;line-height:1.5;margin:8px 0 0"></p>
   <button id="m1" class="big"></button><button id="m5" class="big alt"></button>
   <button id="m6" class="big sm">🏆 순위표</button><button id="m7" class="big sm">📤 친구에게 알리기</button><button id="m4" class="big sm">📖 규칙 · 🏅 내 기록</button><button id="m3" class="big sm">⚙️ 설정</button><div id="ver"></div></div>
 </div>
 <div id="shop" class="ov sh"><div class="card" style="top:14px;height:772px;padding:12px"><h2 id="st" style="margin:0 0 4px;font-size:26px"></h2><div id="ss" class="sum"></div><div id="sw" style="margin-bottom:4px"></div><div id="shl"></div><button id="s1" class="big" style="height:56px;margin-top:6px"></button></div></div>
 <div id="over" class="ov sh"><div class="card" style="top:70px"><h2 id="ot"></h2><div id="obd" style="font-size:19px;line-height:1.6"></div><button id="o1" class="big">🔁 다시 도전</button><button id="o4" class="big sm">🏆 순위표 보기</button><button id="o3" class="big sm">🏠 처음으로</button></div></div>
 <div id="pause" class="ov sh"><div class="card" style="top:200px"><h2>⏸️ 잠깐 멈췄어요</h2><button id="p1" class="big">▶ 계속하기</button><button id="p2" class="big sm">🏳️ 포기하고 처음으로</button></div></div>
 <div id="set" class="ov sh"><div class="card" style="top:180px"><h2>⚙️ 설정</h2><button id="sk" class="big sm"></button><button id="sn" class="big sm"></button><button id="rs" class="big sm">🗑️ 기록·저장 지우기</button><button id="sc" class="big sm">닫기</button></div></div>
 <div id="how" class="ov sh"><div class="card" style="top:24px;height:752px;padding:14px"><h2 style="margin:0 0 6px;font-size:28px">📖 규칙 · 🏅 기록</h2><div id="hw" style="height:620px;overflow-y:auto;touch-action:pan-y;text-align:left;font-size:16px;line-height:1.55"></div><button id="hx" class="big sm" style="margin-top:6px;height:48px">닫기</button></div></div>
 <div id="nick" class="ov sh"><div class="card" style="top:150px"><div style="font-size:60px">🙂</div><h2 id="nkh" style="font-size:24px"></h2><input id="nki" maxlength="10" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="닉네임 (10글자까지)"><div id="nke" class="err"></div><p style="font-size:14px;margin:4px 0 0;opacity:.75">로그인은 필요 없어요. 순위표에 이 이름이 보여요.</p><button id="nk1" class="big">✅ 정했어요</button><button id="nkx" class="big sm">취소</button></div></div>
 <div id="lb" class="ov sh"><div class="card" style="top:24px;height:752px;padding:14px"><h2 style="margin:0 0 6px;font-size:28px">🏆 순위표</h2><div class="tabs"><button id="lbt0" class="tab">이번 주</button><button id="lbt1" class="tab">지난 주</button></div><div id="lbh" class="ht" style="margin:2px 0 6px;text-align:center"></div><div id="lbl"></div><div style="display:flex;gap:8px;margin-top:6px"><button id="lbr" class="big sm" style="width:35%;height:48px">🔄 새로고침</button><button id="lbx" class="big sm" style="flex:1;height:48px">닫기</button></div></div></div>
 <div id="toast"></div>
</div>
