<style>
:root{--bg:#fff1dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);overflow:hidden;position:relative;font-family:"Jua","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#5a3a22;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}

canvas{position:absolute;inset:0;width:450px;height:800px;touch-action:none}
.ov{position:absolute;inset:0;display:none}
button{font:inherit;color:#5a3a22;border:0;border-radius:18px;background:#fff;box-shadow:0 4px 0 #e0c4a0;cursor:pointer;touch-action:manipulation}

#toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:#5a3a22;color:#fff;padding:9px 18px;border-radius:20px;font-size:18px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:420px;z-index:9}
.it{display:flex;align-items:center;gap:10px;background:#fff6e6;border-radius:18px;padding:8px 10px;margin-bottom:8px}

.it button{width:112px;height:48px;font-size:16px;padding:0}

.it button.on{background:#d6f5d6;box-shadow:0 4px 0 #a8d8a8}
.it.sel{outline:3px solid #ffc94a}
.it.rec{background:#fff1b8;outline:3px solid #ffc94a}.it .why{color:#c0601a;font-weight:400;font-size:14px}
.dx{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.dx div{background:#fff6e6;border-radius:14px;padding:8px 0;text-align:center;font-size:13px}.dx b{display:block;font-size:34px;font-weight:400}
.bar{height:14px;border-radius:8px;background:#f0e0c8;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:#7ed88a}
.hmb{display:flex;gap:8px;margin-top:8px}.hmb button{flex:1;height:50px;font-size:18px;padding:0}
#hm .pn{position:absolute;left:14px;right:14px;top:528px;background:rgba(255,255,255,.93);border-radius:24px;padding:12px 14px 14px;text-align:center}

#dtabs{display:flex;gap:6px;overflow-x:auto;touch-action:pan-x;padding:2px 0 8px;scrollbar-width:none}#dtabs::-webkit-scrollbar{display:none}

#dl{height:262px;overflow-y:auto;touch-action:pan-y}
#shl{height:430px;overflow-y:auto;touch-action:pan-y;text-align:left}
.card input{width:100%;box-sizing:border-box;height:56px;border:3px solid #f0c890;border-radius:16px;font:inherit;font-size:24px;text-align:center;color:#5a3a22;background:#fffaf0;margin:8px 0 4px;user-select:text;-webkit-user-select:text;touch-action:auto;outline:none}
.err{color:#d03030;font-size:16px;min-height:22px}
#hc{flex:0 0 128px;margin-top:0;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;border-radius:18px;background:#ff7a45;box-shadow:0 4px 0 #c8501f;font-size:21px;text-shadow:0 1px 0 rgba(0,0,0,.2)}
#hc:active{transform:translateY(3px);box-shadow:0 1px 0 #c8501f}
